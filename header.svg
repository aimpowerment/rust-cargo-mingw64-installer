<svg xmlns="http://w3.org" viewBox="0 0 1200 320" width="1200" height="320">
  <rect width="1200" height="320" rx="16" fill="#0d1117"/>
  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="60" y="42" width="140" height="6" rx="3" fill="#f74c00"/>

  <text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#f0f6fc">
    Portable Rust + MinGW-w64
  </text>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8b949e">
    1-Click Windows Setup | Zero Visual Studio Build Tools
  </text>

  <rect x="60" y="185" width="165" height="34" rx="17" fill="#2b1810" stroke="#f74c00" stroke-width="1.5"/>
  <text x="142" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff8b53">
    Rust GNU / gnullvm
  </text>

  <rect x="239" y="185" width="175" height="34" rx="17" fill="#102033" stroke="#388bfd" stroke-width="1.5"/>
  <text x="326" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#79c0ff">
    MinGW-w64 MSVCRT
  </text>

  <rect x="428" y="185" width="145" height="34" rx="17" fill="#102918" stroke="#2ea043" stroke-width="1.5"/>
  <text x="500" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#56d364">
    100% Portable
  </text>

  <text x="60" y="275" font-family="Courier New, monospace" font-size="15" fill="#8b949e">
    setup_rust_mingw.bat  |  [N] Fresh Install  |  [U] Re-link Paths
  </text>

  <rect x="760" y="52" width="380" height="216" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="782" cy="72" r="5.5" fill="#ff5f56"/>
  <circle cx="800" cy="72" r="5.5" fill="#ffbd2e"/>
  <circle cx="818" cy="72" r="5.5" fill="#27c93f"/>
  <line x1="760" y1="90" x2="1140" y2="90" stroke="#21262d" stroke-width="1"/>

  <text x="780" y="118" font-family="Courier New, monospace" font-size="14" fill="#79c0ff">$ rustc --version</text>
  <text x="780" y="140" font-family="Courier New, monospace" font-size="14" fill="#8b949e">rustc 1.100.0 (windows-gnu)</text>

  <text x="780" y="172" font-family="Courier New, monospace" font-size="14" fill="#79c0ff">$ gcc --version</text>
  <text x="780" y="194" font-family="Courier New, monospace" font-size="14" fill="#8b949e">gcc.exe (MinGW-W64 MSVCRT)</text>

  <text x="780" y="226" font-family="Courier New, monospace" font-size="14" fill="#79c0ff">$ cargo run</text>
  <text x="780" y="248" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#56d364">[OK] Hello, world!</text>
</svg>
